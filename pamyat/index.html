<h1 id="t0" class="h1" style="font-size: 64px">Memory is not an archive. It’s a root.</h1>
<p style="margin: 0; max-width: 600px; font-size: 18px; line-height: 1.55; color: #3F3A57">We remember to understand who we are. When a photo is erased, retouched or “restored” without saying how, it isn’t just an image that changes: it changes what a society believes happened. In the Soviet Union, people were erased from photographs. In 2050, an AI can rebuild the past in seconds, with perfect colors and the wrong dates.</p>
<p style="margin: 0; max-width: 600px; font-size: 18px; line-height: 1.55; color: #3F3A57">In PAMYAT you investigate six real photographs from Russian history: you compare their versions, find what changed and decide what deserves to be remembered.</p>

<div style="padding: 28px 0 4px; display: flex; flex-wrap: wrap; gap: 16px 48px; align-items: flex-end">
<h2 style="flex: 1 1 300px; margin: 0; font-size: 44px; line-height: 1.05; font-weight: 700; letter-spacing: -0.035em">Memories are roots.</h2>
<p style="flex: 1.4 1 380px; margin: 0; font-size: 18px; line-height: 1.6; color: #3F3A57">No story grows from a single seed. Our history is held up by many roots: the big events everyone remembers and, under them, thousands of smaller ones. Every little story and every version that someone lived is a thinner root. We all come from the same earth, connected underground even when we can’t see it.</p>
</div>
<div style="position: relative; margin-top: 8px">
<div style="position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 24px">

<p style="margin: 0; font-size: 14px; line-height: 1.55; color: #3F3A57">{{pl.text}}</p>
</article>
</sc-for>
</div>
</div>
</section>
</sc-if>

<script>
class DCLogic {
  constructor() { this.state = {}; }
  setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); if (window.__pamyatSchedule) window.__pamyatSchedule(); }
}

const ST = {
  doc: { w: '', sym: '■', cls: 'p-doc' },
  int: { w: 'Interpretation', sym: '◆', cls: 'p-int' },
  unk: { w: 'Unknown', sym: '?', cls: 'p-unk' },
  ia: { w: 'AI', sym: '⬡', cls: 'p-ia' },
  alt: { w: 'Altered', sym: '✕', cls: 'p-alt' },
  disp: { w: 'Disputed', sym: '≠', cls: 'p-disp' }
};
const B = 'img/';
const ROOT_COL = { doc: '#F2A65A', int: '#86B59C', ia: '#B7A6EC', disp: '#F5C451', alt: '#F08A80', unk: '#C9C7D3' };
const ROOT_DARK = { doc: '#C66A22', int: '#5E8F7C', ia: '#7E66C9', disp: '#C9901A', alt: '#C0544A', unk: '#8E8B9E' };
const ROOT_HI = { doc: '#FFD39A', int: '#B9DAC4', ia: '#DDD4FA', disp: '#FFE39E', alt: '#FFC6BF', unk: '#ECEBF1' };
const NODE_BG = { doc: '#F5EEDD', int: '#EEF6E2', ia: '#EDE6FF', disp: '#FFF4DF', alt: '#FDECEA', unk: '#FFFFFF' };
const NODE_BD = { doc: '#C7A974', int: '#6FA03C', ia: '#8E7CC3', disp: '#E3A33B', alt: '#E2574C', unk: '#9A97A8' };

function rng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return function () { s = s * 16807 % 2147483647; return (s - 1) / 2147483646; }; }
function grow(r, x, y, a, len, w, depth, out) {
  if (depth <= 0 || len < 3) return;
  const bend = (r() - 0.5) * 0.9;
  const nx = x + Math.cos(a + bend * 0.5) * len, ny = y + Math.sin(a + bend * 0.5) * len;
  const cx = x + Math.cos(a + bend) * len * 0.55, cy = y + Math.sin(a + bend) * len * 0.55;
  const b = w > 2.2 ? 0 : (w > 1.1 ? 1 : 2);
  out[b] += 'M' + x.toFixed(1) + ' ' + y.toFixed(1) + 'Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + nx.toFixed(1) + ' ' + ny.toFixed(1);
  const na = a + bend * 0.6 + (Math.PI / 2 - a) * 0.05;
  grow(r, nx, ny, na, len * 0.9, w * 0.8, depth - 1, out);
  if (r() < 0.52) grow(r, nx, ny, a + (r() < 0.5 ? -1 : 1) * (0.5 + r() * 0.7), len * 0.72, w * 0.6, depth - 1, out);
}
function roots(seed, starts) { const r = rng(seed); const out = ['', '', '']; starts.forEach((s) => grow(r, s[0], s[1], s[2], s[3], s[4], s[5], out)); return { thick: out[0], mid: out[1], fine: out[2] }; }
const PI = Math.PI;
