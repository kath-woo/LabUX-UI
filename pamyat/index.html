.flyA{animation:flyA .8s cubic-bezier(.2,.8,.25,1) both;transform-origin:50% 60%}
.flyB{animation:flyB .8s cubic-bezier(.2,.8,.25,1) both;transform-origin:50% 60%}
.flyBack{animation:flyBack .42s cubic-bezier(.5,0,.75,.4) both;transform-origin:50% 60%}
.shine{position:absolute;inset:8px;border-radius:10px;overflow:hidden;pointer-events:none}

.fadeIn{animation:fadeIn .35s ease both}
.fadeOut{animation:fadeOut .42s ease both}

<h1 id="t0" class="h1" style="font-size: 64px">La memoria no es un archivo. Es una raíz.</h1>
<p style="margin: 0; max-width: 600px; font-size: 18px; line-height: 1.55; color: #3F3A57">Recordamos para entender quiénes somos. Cuando una foto se borra, se retoca o se «restaura» sin decir cómo, no cambia solo una imagen: cambia lo que una sociedad cree que pasó. En la Unión Soviética se borraba a personas de las fotografías. En 2050, una IA puede reconstruir el pasado en segundos, con colores perfectos y fechas equivocadas.</p>
<p style="margin: 0; max-width: 600px; font-size: 18px; line-height: 1.55; color: #3F3A57">En PAMYAT investigas seis fotografías reales de la historia rusa: comparas sus versiones, encuentras lo que cambió y decides qué merece ser recordado.</p>
<div style="margin-top: 6px"><button class="btn btn-p" onClick="{{startGame}}">Empezar la investigación</button></div>
